name: Validate issue 1560
on:
  push:
    branches: [validation/1560-horizon]
jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Complete compact full-suite output for PR
        run: |
          mkdir -p results
          cargo fmt --check
          set -o pipefail
          cargo test -p liquifact_escrow --lib -- --format terse 2>&1 | tee results/full-tests-terse.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-1560-terse
          path: results
