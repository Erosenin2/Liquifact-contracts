name: Validate issue 1560
on:
  push:
    branches: [validation/1560-horizon]
jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Install official Stellar CLI
        run: |
          mkdir -p "$RUNNER_TEMP/stellar"
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$RUNNER_TEMP/stellar"
          echo "$RUNNER_TEMP/stellar" >> "$GITHUB_PATH"
      - name: Complete compact full-suite output for PR
        run: |
          mkdir -p results
          cargo fmt --check
          set -o pipefail
          cargo test -p liquifact_escrow --lib -- --format terse 2>&1 | tee results/full-tests-terse.log
      - name: Clippy and final deploy Wasm
        run: |
          set -o pipefail
          cargo clippy --all-targets 2>&1 | tee results/clippy.log
          cargo build --target wasm32v1-none --release -p liquifact_escrow 2>&1 | tee results/build.log
          stellar contract optimize --wasm target/wasm32v1-none/release/liquifact_escrow.wasm --wasm-out results/opt.wasm 2>&1 | tee results/optimize.log
          python3 scripts/strip_spec_docs.py results/opt.wasm results/deploy.wasm | tee results/size.log
          test "$(stat -c %s results/deploy.wasm)" -lt 131072
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-1560-terse
          path: results
